# AndroidX is opt-in. Every dependency in this project (appcompat, material,
# room, biometric, recyclerview) is an AndroidX artifact, so this is required.
android.useAndroidX=true

# Rewrites any old com.android.support references in third-party libraries.
# Not strictly needed here, but harmless and saves trouble if you add a dep later.
android.enableJetifier=false

# Room's annotation processor and SQLCipher's build step are memory-hungry.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Faster incremental builds.
org.gradle.parallel=true
org.gradle.caching=true

# Keep each module's R class to its own resources instead of merging in every
# library's. Default in AGP 8, stated here so the behaviour is explicit.
android.nonTransitiveRClass=true
