# Builds a signed release APK and publishes it as a GitHub Release whenever a version tag is
# pushed:   git tag v1.0.0   then   git push origin v1.0.0
#
# Needs four repository secrets (Settings > Secrets and variables > Actions):
#   TAGO_KEYSTORE_BASE64    the release keystore (.jks), base64-encoded
#   TAGO_KEYSTORE_PASSWORD  its store password
#   TAGO_KEY_ALIAS          the key alias inside it (e.g. tago)
#   TAGO_KEY_PASSWORD       the key's password
#
# Obtainium (or anyone using the "latest release" link) picks up each new release.
name: Release APK

on:
  push:
    tags: ['v*']

permissions:
  contents: write   # to create the release; nothing else

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # A tampered gradle-wrapper.jar would run inside the build with the signing key present.
      - uses: gradle/actions/wrapper-validation@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Check the tag is a version
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]{1,2}\.[0-9]{1,2}$ ]]; then
            echo "Tag '$GITHUB_REF_NAME' is not vMAJOR.MINOR.PATCH (e.g. v1.0.0); not releasing." >&2
            exit 1
          fi

      - name: Restore the signing key
        env:
          TAGO_KEYSTORE_BASE64: ${{ secrets.TAGO_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$TAGO_KEYSTORE_BASE64" ]; then
            echo "The TAGO_KEYSTORE_BASE64 secret is missing." >&2
            exit 1
          fi
          echo "$TAGO_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"

      - name: Build the signed release APK
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          TAGO_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          TAGO_KEYSTORE_PASSWORD: ${{ secrets.TAGO_KEYSTORE_PASSWORD }}
          TAGO_KEY_ALIAS: ${{ secrets.TAGO_KEY_ALIAS }}
          TAGO_KEY_PASSWORD: ${{ secrets.TAGO_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      # An unsigned APK (the build's output when signing is not configured) must never ship.
      - name: Check the APK is signed
        run: |
          apk=app/build/outputs/apk/release/app-release.apk
          if [ ! -f "$apk" ]; then
            echo "No signed APK was produced (only an unsigned one?)." >&2
            exit 1
          fi
          cp "$apk" "Tago-${GITHUB_REF_NAME}.apk"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "Tago-${GITHUB_REF_NAME}.apk" \
            --title "Tago ${GITHUB_REF_NAME}" \
            --generate-notes

      - name: Remove the signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
