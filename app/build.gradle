plugins {
    id 'com.android.application'
}

// Version from the release tag, e.g. RELEASE_TAG=v1.2.3 -> versionName "1.2.3", versionCode 10203.
// The GitHub release workflow sets it; local builds stay 1.0 (code 1). Every release must count
// higher than the one installed, or Android refuses the update. Minor and patch go up to 99.
def releaseTag = System.getenv("RELEASE_TAG") ?: ""
def tagParts = (releaseTag =~ /^v(\d+)\.(\d+)\.(\d+)$/)
def tagged = tagParts.matches()
def appVersionName = tagged ? "${tagParts[0][1]}.${tagParts[0][2]}.${tagParts[0][3]}" : "1.0"
def appVersionCode = tagged
        ? (tagParts[0][1] as int) * 10000 + (tagParts[0][2] as int) * 100 + (tagParts[0][3] as int)
        : 1

// Release signing reads the key from the environment (GitHub secrets in the workflow), so no
// key or password is ever in the repository. Without TAGO_KEYSTORE_FILE a release build is
// left unsigned rather than falling back to the debug key, which would break updates.
def releaseKeystore = System.getenv("TAGO_KEYSTORE_FILE")

android {
    namespace 'com.passvault'
    compileSdk 34

    defaultConfig {
        applicationId "com.passvault"
        minSdk 26          // AutofillService requires API 26
        targetSdk 34
        versionCode appVersionCode
        versionName appVersionName

        // Room writes a JSON snapshot of each schema version to app/schemas/,
        // so migrations can be checked and tested. Commit that folder.
        javaCompileOptions {
            annotationProcessorOptions {
                arguments += ["room.schemaLocation": "$projectDir/schemas".toString()]
            }
        }
    }

    signingConfigs {
        release {
            if (releaseKeystore) {
                storeFile file(releaseKeystore)
                storePassword System.getenv("TAGO_KEYSTORE_PASSWORD")
                keyAlias System.getenv("TAGO_KEY_ALIAS")
                keyPassword System.getenv("TAGO_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (releaseKeystore) signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        viewBinding true
    }

    packaging {
        jniLibs {
            useLegacyPackaging = false
        }
    }

}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.viewpager2:viewpager2:1.0.0'
    implementation 'androidx.lifecycle:lifecycle-process:2.7.0'

    // Biometric / device-credential prompt
    implementation 'androidx.biometric:biometric:1.1.0'

    // Room
    implementation 'androidx.room:room-runtime:2.6.1'
    annotationProcessor 'androidx.room:room-compiler:2.6.1'

    // SQLCipher (encrypted SQLite) — new artifact, package net.zetetic.database.sqlcipher
    implementation 'net.zetetic:sqlcipher-android:4.10.0@aar'
    implementation 'androidx.sqlite:sqlite:2.4.0'
}